[package]
name = "prompt-note"
version = "0.1.0"
description = "Prompt Note — local prompt workspace"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prompt_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "image-ico"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
uuid = { version = "1.29.2", features = ["v7"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-single-instance = "2.5.5"
enigo = "0.6.1"
# 与官方 SQL 插件使用相同的 sqlx 主次版本，避免 SQLite 链接冲突。
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
