name: Windows EXE
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    # 清理旧产物需调用 Actions 删除 API，在只读基础上追加产物管理权限。
    permissions:
      contents: read
      actions: write
    env:
      # 外层交付包使用连字符，包内主程序仍保留 Prompt Note.exe。
      BUILD_ARTIFACT_NAME: Prompt-Note.zip
    steps:
      # 固定已核验稳定版的完整提交，避免版本标签移动影响构建。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      # CI 安装与本地“只修改版本、不安装”相互独立；冻结锁文件保证重现。
      - name: Enable pnpm
        run: npm install --global pnpm@11.7.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type safety
        run: pnpm typecheck
      - name: Logic checks
        run: pnpm lint
      # Windows 原生命令分步骤执行，防止后一个成功退出码覆盖前一个失败。
      - name: Architecture check
        run: pnpm check:cycles
      - name: Business unit tests
        run: pnpm test
      - name: Rust type check
        working-directory: src-tauri
        run: cargo check --locked
      - name: Rust transaction tests
        working-directory: src-tauri
        run: cargo test --locked --lib
      - name: Build portable executable
        # 直接调用已安装的 CLI，避免 pnpm 消费转发给 Cargo 的参数分隔符。
        run: node node_modules/@tauri-apps/cli/tauri.js build --no-bundle -- --locked
      - name: Verify EXE output
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath 'src-tauri/target/release/Prompt Note.exe')) { throw 'Missing portable EXE' }
      - name: Verify native single instance
        shell: pwsh
        run: ./scripts/verify-single-instance.ps1

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $executable = Get-Item -LiteralPath 'src-tauri/target/release/Prompt Note.exe'
          if ($executable.PSIsContainer -or $executable.Length -eq 0) { throw '主程序不是有效的非空文件' }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $archivePath = Join-Path artifacts $env:BUILD_ARTIFACT_NAME
          # 外层 ZIP 使用固定连字符名称，包内 EXE 保留原名，不随产物名改写。
          Compress-Archive -LiteralPath $executable.FullName -DestinationPath $archivePath -CompressionLevel Optimal -Force
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $archivePath).Path)
          try {
            if ($archive.Entries.Count -ne 1 -or
                $archive.Entries[0].FullName -cne $executable.Name -or
                $archive.Entries[0].Length -ne $executable.Length) {
              throw 'ZIP 校验失败：根目录必须仅包含原名主程序，且大小与源文件一致'
            }
          } finally {
            $archive.Dispose()
          }

      # 移植自 Cli-Auto-Panel：新 ZIP 已校验才清理旧包，在上传前释放存储额度；
      # 仅删除本工作流、已结束且早于当前运行的旧产物，进行中运行与其他工作流不受影响。
      - name: Clean up old artifacts of this workflow
        timeout-minutes: 5
        shell: pwsh
        env:
          ARTIFACT_CLEANUP_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $apiRoot = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions"
          $headers = @{
            Authorization = "Bearer $env:ARTIFACT_CLEANUP_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $currentRunId = [long]$env:GITHUB_RUN_ID
          $currentRun = Invoke-RestMethod -Uri "$apiRoot/runs/$currentRunId" -Headers $headers -TimeoutSec 30
          $currentStartedAt = [DateTimeOffset]::Parse($currentRun.run_started_at)
          $workflowByRun = @{}
          $artifactIds = [System.Collections.Generic.HashSet[long]]::new()
          $artifactName = [uri]::EscapeDataString($env:BUILD_ARTIFACT_NAME)
          $page = 1

          # 先分页收集，再删除，避免边删除边翻页造成遗漏。
          do {
            $response = Invoke-RestMethod -Uri "$apiRoot/artifacts?name=$artifactName&per_page=100&page=$page" -Headers $headers -TimeoutSec 30
            $artifacts = @($response.artifacts)
            foreach ($artifact in $artifacts) {
              $sourceRunId = [long]$artifact.workflow_run.id
              if ($artifact.name -cne $env:BUILD_ARTIFACT_NAME -or $sourceRunId -ge $currentRunId -or
                  [DateTimeOffset]::Parse($artifact.created_at) -ge $currentStartedAt) {
                continue
              }
              if (-not $workflowByRun.ContainsKey($sourceRunId)) {
                $workflowByRun[$sourceRunId] = Invoke-RestMethod -Uri "$apiRoot/runs/$sourceRunId" -Headers $headers -TimeoutSec 30
              }
              $sourceRun = $workflowByRun[$sourceRunId]
              # 不影响其他工作流、仍在执行的运行以及比当前运行更新的包。
              if ($sourceRun.workflow_id -eq $currentRun.workflow_id -and $sourceRun.status -eq "completed") {
                [void]$artifactIds.Add([long]$artifact.id)
              }
            }
            $page += 1
          } while ($artifacts.Count -eq 100)

          foreach ($artifactId in $artifactIds) {
            try {
              Invoke-RestMethod -Method Delete -Uri "$apiRoot/artifacts/$artifactId" -Headers $headers -TimeoutSec 30 | Out-Null
              Write-Host "已删除旧产物：$artifactId"
            } catch [Microsoft.PowerShell.Commands.HttpResponseException] {
              # 不同分支可能并行清理；仅将已被删除的 404 视为完成，其他错误直接失败。
              if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
              Write-Host "旧产物已由其他流程移除：$artifactId"
            }
          }
          Write-Host "旧产物清理完成，共处理 $($artifactIds.Count) 份。"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: artifacts/${{ env.BUILD_ARTIFACT_NAME }}
          # ZIP 已自行打包并校验，直接上传，避免下载得到 ZIP 套 ZIP。
          archive: false
          if-no-files-found: error
          # 固定名覆盖上传：同一运行重试直接替换旧包；跨运行旧包由上方清理步骤处理，
          # 兜底保留 1 天自动过期，需下载时在 Actions 页面手动触发（workflow_dispatch）重新构建。
          overwrite: true
          retention-days: 1
